name: Test

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  TF_VERSION: "1.12.2"

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Validate Examples
      run: |
        for example in examples/*/; do
          echo "Validating $example"
          cd "$example"
          terraform init
          terraform validate
          cd - > /dev/null
        done

  terraform-test:
    name: Terraform Test
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Setup mock AWS provider for tests
      run: |
        cat > provider_override.tf << 'EOF'
        provider "aws" {
          region                      = "us-east-1"
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          access_key                  = "test"
          secret_key                  = "test"
        }
        EOF

    - name: Terraform Init
      run: terraform init

    - name: Run Terraform Tests and Generate Report
      run: |
        # Run tests with verbose output
        terraform test -verbose

        # Generate test report (reuse the same provider setup)
        terraform test -junit-xml=test-results.xml
      continue-on-error: true

    - name: Cleanup mock provider
      if: always()
      run: rm -f provider_override.tf

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results
        path: test-results.xml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: terraform init

    - name: Run tfsec
      uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
      with:
        working_directory: .
        format: sarif
        soft_fail: true
        version: latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload SARIF file
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tfsec-sarif
        path: 'tfsec.sarif'

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
      with:
        tflint_version: latest

    - name: Init TFLint
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: tflint --init

    - name: Run TFLint
      run: tflint --format=compact

  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Setup terraform-docs
      uses: jaxxstorm/action-install-gh-release@25d5e2dd555cd74f1fab9ac1e6ea117acde2c0c4 # v1.12.0
      with:
        repo: terraform-docs/terraform-docs
        tag: v0.20.0

    - name: Check documentation is up to date
      run: |
        # Verify the markers exist in the README
        if ! grep -q "<!-- BEGIN_TF_DOCS -->" README.md; then
          echo "Error: README.md is missing '<!-- BEGIN_TF_DOCS -->' marker"
          exit 1
        fi

        if ! grep -q "<!-- END_TF_DOCS -->" README.md; then
          echo "Error: README.md is missing '<!-- END_TF_DOCS -->' marker"
          exit 1
        fi

        # Create a backup of the original file
        cp README.md README_BACKUP.md

        # Generate docs using inject mode
        terraform-docs markdown table --output-file README.md --output-mode inject .

        # Compare the files
        if ! diff -u README_BACKUP.md README.md > /dev/null; then
          echo "Documentation is out of date. Please run:"
          echo "  terraform-docs markdown table --output-file README.md --output-mode inject ."
          echo ""
          echo "Differences found:"
          diff -u README_BACKUP.md README.md || true
          exit 1
        fi

        echo "Documentation is up to date"
        rm -f README_BACKUP.md
